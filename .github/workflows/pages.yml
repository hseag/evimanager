name: Deploy docs to GitHub Pages

on:
  push:
    branches: ["main", "pre-release"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_CACHE_DIR: "1"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Prepare Pages content
        env:
          BRANCH_NAME: ${{ github.ref_name }}      
        run: |
          BRANCH_SLUG="$(printf '%s' "$BRANCH_NAME" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9.]+/-/g; s/^[.-]+//; s/[.-]+$//' | cut -c1-63)"
          test -n "$BRANCH_SLUG"
          PAGES_DIR="public/${BRANCH_SLUG}"

          python -m pip install mkdocs-material
          rm -rf "$PAGES_DIR"
          mkdir -p "$PAGES_DIR"
          mkdocs build --site-dir "$PAGES_DIR"
          cp -r downloads "$PAGES_DIR/"

          cat > public/index.html <<'EOF'
          <!doctype html>
          <meta http-equiv="refresh" content="0; url=main/">
          <script>
            location.replace(`main/${location.search}${location.hash}`);
          </script>
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  check-pages-smoke:
    name: Check deployed Pages smoke
    needs: deploy
    runs-on: ubuntu-latest

    steps:
      - name: Verify deployed Python API page is reachable
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          BRANCH_SLUG="$(printf '%s' "$BRANCH_NAME" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9.]+/-/g; s/^[.-]+//; s/[.-]+$//' | cut -c1-63)"
          
          test -n "$BRANCH_SLUG"
          url="${PAGE_URL%/}/${BRANCH_SLUG}/index.html"
          printf 'Documentation will be available at: %s\n' "${PAGE_URL%/}/${BRANCH_SLUG}/"
          echo "Checking $url"
          for i in $(seq 1 12); do
            if curl --fail --silent --show-error --location "$url" -o page.html; then
              exit 0
            fi
            sleep 5
          done
          echo "Deployed page did not become reachable in time"
          exit 1

  check-links:
    name: Check markdown links
    needs: deploy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Run lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: --config .github/workflows/lychee.toml --no-progress --insecure --format detailed "**/*.md"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  check-markdown-local-links:
    name: Check markdown local links
    needs: deploy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check local markdown links
        run: python .github/workflows/check_markdown_local_links.py

  check-markdown-markers:
    name: Check markdown markers
    needs: deploy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Check for unreplaced markdown markers
        run: |
          if matches="$(find . -type f -name '*.md' -exec grep -Hn -E '__[A-Z0-9_]+__' {} +)"; then
            printf '\033[31mERROR: Found unreplaced markdown markers:\033[0m\n'
            printf '%s\n' "$matches"
            exit 1
          fi